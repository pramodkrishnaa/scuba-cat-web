<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scuba Cat 🐱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <h1>Scuba Cat 🐱</h1>
  <p id="splash-text">Let's get ready to dance...</p>
</div>

<main id="app" hidden>
  <div class="stage-wrap">
    <div class="stage" id="cam-stage">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div class="stage meme-pane" id="meme-pane">
      <video id="meme-video" playsinline muted loop src="assets/scuba_cat.mp4"></video>
    </div>
  </div>
  <button id="test-btn">no camera? tap here</button>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
